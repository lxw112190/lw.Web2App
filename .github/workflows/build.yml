name: Windows and Linux x64

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows 2022 - build, test and package
    runs-on: windows-2022

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Checkout integration test project
        uses: actions/checkout@v6
        with:
          repository: lxw112190/wechat-article-formatter
          ref: main
          path: integration/wechat-article-formatter

      - name: Set up Node.js for integration test
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: integration/wechat-article-formatter/package-lock.json

      - name: Install Inno Setup compiler
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Configure Release x64
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Build integration test project
        working-directory: integration/wechat-article-formatter
        run: |
          npm ci
          npm run build

      - name: Package and inspect integration test application
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $packageVersion = (Get-Content `
            integration/wechat-article-formatter/package.json | ConvertFrom-Json).version
          $numericVersion = ($packageVersion -split '[+-]')[0]
          $versionParts = @($numericVersion -split '\.')
          while ($versionParts.Count -lt 4) { $versionParts += '0' }
          $peVersion = ($versionParts[0..3] -join '.')
          New-Item -ItemType Directory -Force dist/lw.Web2App/examples | Out-Null
          $packer = (Resolve-Path 'build/Release/lw.Web2App.exe').Path
          $source = (Resolve-Path 'integration/wechat-article-formatter/dist').Path
          $output = Join-Path $PWD 'dist/lw.Web2App/examples/wechat-article-formatter.exe'
          $pack = Start-Process -FilePath $packer -Wait -PassThru -NoNewWindow `
            -ArgumentList @(
              'pack', $source, $output,
              '--title', '公众号排版助手',
              '--product-name', '公众号排版助手',
              '--file-description', '微信公众号文章排版桌面工具',
              '--width', '1440', '--height', '900',
              '--company', '天天代码码天天',
              '--version', $peVersion,
              '--copyright', '"Copyright © 2026 天天代码码天天"'
            )
          if ($pack.ExitCode -ne 0 -or -not (Test-Path $output)) {
            throw "Integration test packaging failed with exit code $($pack.ExitCode)"
          }
          $versionInfo = (Get-Item $output).VersionInfo
          $expected = @{
            ProductName = '公众号排版助手'
            FileDescription = '微信公众号文章排版桌面工具'
            CompanyName = '天天代码码天天'
            FileVersion = $peVersion
            ProductVersion = $peVersion
            LegalCopyright = 'Copyright © 2026 天天代码码天天'
          }
          foreach ($field in $expected.Keys) {
            if ($versionInfo.$field -ne $expected[$field]) {
              throw "PE metadata mismatch for ${field}: '$($versionInfo.$field)'"
            }
          }
          $inspect = Start-Process -FilePath $packer -Wait -PassThru -NoNewWindow `
            -ArgumentList @('inspect', $output)
          if ($inspect.ExitCode -ne 0) {
            throw "Integration test payload inspection failed with exit code $($inspect.ExitCode)"
          }
          Copy-Item integration/wechat-article-formatter/LICENSE `
            dist/lw.Web2App/examples/wechat-article-formatter-LICENSE.txt

      - name: Package and inspect Native IPC example
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $packer = (Resolve-Path 'build/Release/lw.Web2App.exe').Path
          $output = Join-Path $PWD 'dist/lw.Web2App/examples/native-ipc.exe'
          $pack = Start-Process -FilePath $packer -Wait -PassThru -NoNewWindow `
            -ArgumentList @(
              'pack', 'examples/native-ipc', $output,
              '--title', '"Native IPC 示例"',
              '--windowed', '--ipc',
              '--ipc-capability', 'app.info',
              '--ipc-capability', 'dialog.directory',
              '--ipc-capability', 'dialog.file',
              '--ipc-capability', 'fs.exists',
              '--ipc-capability', 'fs.list',
              '--ipc-capability', 'fs.copy',
              '--ipc-capability', 'fs.move',
              '--ipc-capability', 'fs.delete'
            )
          if ($pack.ExitCode -ne 0 -or -not (Test-Path $output)) {
            throw "Native IPC example packaging failed with exit code $($pack.ExitCode)"
          }
          $inspect = Start-Process -FilePath $packer -Wait -PassThru -NoNewWindow `
            -ArgumentList @('inspect', $output)
          if ($inspect.ExitCode -ne 0) {
            throw "Native IPC example inspection failed"
          }

      - name: Launch generated Windows Runtime and verify Native IPC
        shell: pwsh
        timeout-minutes: 2
        run: |
          .github/scripts/windows-runtime-e2e.ps1 `
            -Packer (Resolve-Path 'build/Release/lw.Web2App.exe').Path `
            -Source (Resolve-Path 'tests/fixtures/runtime-e2e').Path `
            -WorkDirectory (Join-Path $PWD 'build/runtime-e2e')

      - name: Upload Windows Runtime E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: windows-runtime-e2e-diagnostics
          path: build/runtime-e2e/runtime.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Smoke test project publish
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $packer = (Resolve-Path 'build/Release/lw.Web2App.exe').Path
          $output = Join-Path $PWD 'build/project-publish-smoke'
          $publish = Start-Process -FilePath $packer -Wait -PassThru -NoNewWindow `
            -ArgumentList @(
              'publish', '--config',
              (Resolve-Path 'examples/project-config/lwweb.json').Path,
              '--output', $output
            )
          if ($publish.ExitCode -ne 0) { throw 'Project publish failed' }
          $release = Get-ChildItem $output -Directory |
            Where-Object Name -NotLike '.lwweb-*' | Select-Object -First 1
          if (-not $release) { throw 'Published release directory is missing' }
          Push-Location $release.FullName
          try {
            foreach ($line in Get-Content SHA256SUMS.txt) {
              if ($line -notmatch '^([0-9a-f]{64})  (.+)$') {
                throw "Invalid checksum line: $line"
              }
              $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $Matches[2]).Hash.ToLower()
              if ($actual -ne $Matches[1]) { throw "Checksum mismatch: $($Matches[2])" }
            }
            $metadata = Get-Content RELEASE_INFO.json | ConvertFrom-Json
            if ($metadata.format -ne 'lw-web2app-release' -or
                $metadata.artifacts.Count -ne 2) {
              throw 'Invalid release metadata'
            }
            Expand-Archive -LiteralPath $metadata.artifacts[1].file `
              -DestinationPath ../zip-check -Force
          } finally {
            Pop-Location
          }

      - name: Verify Authenticode signed and unsigned repackaging
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "=== 1/8 Create and trust the CI code-signing certificate ==="
          $certificate = New-SelfSignedCertificate -Type CodeSigningCert `
            -Subject 'CN=lw.Web2App CI Test' `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -KeyAlgorithm RSA -KeyLength 2048 -HashAlgorithm SHA256 `
            -NotAfter (Get-Date).AddDays(1)
          $trustedStores = @('Root', 'TrustedPublisher')
          try {
            foreach ($storeName in $trustedStores) {
              $store = [System.Security.Cryptography.X509Certificates.X509Store]::new(
                $storeName, 'CurrentUser')
              $store.Open('ReadWrite')
              try { $store.Add($certificate) } finally { $store.Close() }
            }

            $packer = (Resolve-Path 'build/Release/lw.Web2App.exe').Path
            $signTool = Get-ChildItem `
              "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
              Sort-Object FullName -Descending | Select-Object -First 1
            if (-not $signTool) { throw 'Windows SDK SignTool was not found' }
            New-Item -ItemType Directory -Force build/signing-smoke | Out-Null
            $source = (Resolve-Path 'examples/native-ipc').Path
            $signed = Join-Path $PWD 'build/signing-smoke/signed.exe'
            Write-Host "=== 2/8 Package and sign the Native IPC example ==="
            $pack = Start-Process -FilePath $packer -Wait -PassThru -NoNewWindow `
              -ArgumentList @(
                'pack', $source, $signed,
                '--title', 'Signed-Native-IPC-Example',
                '--sign-cert-thumbprint', $certificate.Thumbprint
              )
            if ($pack.ExitCode -ne 0 -or -not (Test-Path $signed)) {
              throw 'Signed packaging failed'
            }
            Write-Host "Signed package completed"
            Write-Host "=== 3/8 Verify the signed package and payload ==="
            $signature = Get-AuthenticodeSignature $signed
            if ($signature.Status -ne 'Valid') {
              throw "Signed output verification failed: $($signature.StatusMessage)"
            }
            & $signTool.FullName verify /pa /v $signed
            if ($LASTEXITCODE -ne 0) { throw 'SignTool verification failed' }
            $inspect = Start-Process -FilePath $packer -Wait -PassThru -NoNewWindow `
              -ArgumentList @('inspect', $signed)
            if ($inspect.ExitCode -ne 0) { throw 'Signed payload inspection failed' }

            $unsigned = Join-Path $PWD 'build/signing-smoke/repacked-unsigned.exe'
            Write-Host "=== 4/8 Repack the signed Runner as an unsigned application ==="
            $repack = Start-Process -FilePath $signed -Wait -PassThru -NoNewWindow `
              -ArgumentList @(
                'pack', $source, $unsigned,
                '--title', 'Repacked-Unsigned-Native-IPC-Example'
              )
            if ($repack.ExitCode -ne 0 -or -not (Test-Path $unsigned)) {
              throw 'Unsigned repackaging from a signed Runner failed'
            }
            $unsignedSignature = Get-AuthenticodeSignature $unsigned
            if ($unsignedSignature.Status -ne 'NotSigned') {
              throw "Repacked unsigned output retained a signature: $($unsignedSignature.Status)"
            }
            $inspect = Start-Process -FilePath $packer -Wait -PassThru -NoNewWindow `
              -ArgumentList @('inspect', $unsigned)
            if ($inspect.ExitCode -ne 0) { throw 'Unsigned payload inspection failed' }

            Write-Host "=== 5/8 Create the signed publish configuration ==="
            $publishOutput = Join-Path $PWD 'build/signing-smoke/publish-output'
            $projectConfig = Join-Path $PWD 'build/signing-smoke/lwweb.json'
            @{
              schema = 1
              app = @{
                id = 'com.lwweb.ci.signed-publish'
                name = 'Signed Publish'
                version = '1.0.0'
                company = 'lw.Web2App CI'
                description = 'Signed Installer integration test'
              }
              web = @{
                source = $source
                entry = 'index.html'
              }
              publish = @{
                output = $publishOutput
                windows = @{
                  portable = $true
                  zip = $false
                  installer = @{
                    enabled = $true
                    desktop_shortcut = $false
                    start_menu = $true
                  }
                  signing = @{
                    enabled = $true
                    certificate_thumbprint = $certificate.Thumbprint
                    signtool = $signTool.FullName
                  }
                }
              }
            } | ConvertTo-Json -Depth 10 | Set-Content $projectConfig -Encoding utf8NoBOM
            Write-Host "=== 6/8 Publish the signed portable app and Installer ==="
            $publish = Start-Process -FilePath $packer -Wait -PassThru -NoNewWindow `
              -ArgumentList @('publish', '--config', $projectConfig)
            if ($publish.ExitCode -ne 0) { throw 'Signed Installer publish failed' }
            Write-Host "Signed publish completed"
            $release = Join-Path $publishOutput 'Signed Publish-1.0.0-windows-x64'
            $publishedApp = Join-Path $release 'Signed Publish.exe'
            $publishedSetup = Join-Path $release 'Signed Publish-Setup-1.0.0.exe'
            Write-Host "=== 7/8 Verify the published portable application ==="
            foreach ($artifact in @($publishedApp)) {
              if (-not (Test-Path $artifact)) { throw "Missing signed artifact: $artifact" }
              $artifactSignature = Get-AuthenticodeSignature $artifact
              if ($artifactSignature.Status -ne 'Valid') {
                throw "Artifact signature is invalid: $artifact"
              }
              & $signTool.FullName verify /pa /v $artifact
              if ($LASTEXITCODE -ne 0) { throw "SignTool rejected artifact: $artifact" }
            }
            Write-Host "=== 8/8 Verify the published Installer and release metadata ==="
            foreach ($artifact in @($publishedSetup)) {
              if (-not (Test-Path $artifact)) { throw "Missing signed artifact: $artifact" }
              $artifactSignature = Get-AuthenticodeSignature $artifact
              if ($artifactSignature.Status -ne 'Valid') {
                throw "Artifact signature is invalid: $artifact"
              }
              & $signTool.FullName verify /pa /v $artifact
              if ($LASTEXITCODE -ne 0) { throw "SignTool rejected artifact: $artifact" }
            }
            $releaseInfo = Get-Content (Join-Path $release 'RELEASE_INFO.json') |
              ConvertFrom-Json
            $installerArtifact = $releaseInfo.artifacts |
              Where-Object type -eq 'installer'
            if (-not $installerArtifact -or -not $installerArtifact.signed) {
              throw 'Release metadata did not record the signed Installer'
            }
          } finally {
            foreach ($storeName in $trustedStores) {
              $store = [System.Security.Cryptography.X509Certificates.X509Store]::new(
                $storeName, 'CurrentUser')
              $store.Open('ReadWrite')
              try { $store.Remove($certificate) } finally { $store.Close() }
            }
            Remove-Item "Cert:\CurrentUser\My\$($certificate.Thumbprint)" `
              -Force -ErrorAction SilentlyContinue
          }

      - name: Prepare distribution
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force dist/lw.Web2App/docs/assets | Out-Null
          New-Item -ItemType Directory -Force dist/lw.Web2App/third_party/licenses | Out-Null
          Copy-Item build/Release/lw.Web2App.exe dist/lw.Web2App/
          Copy-Item README.md, README_EN.md, LICENSE, THIRD_PARTY_NOTICES.md dist/lw.Web2App/
          Copy-Item docs/assets/sponsor.jpg, docs/assets/lw.Web2App.png, `
            docs/assets/lw.Web2App-linux.png `
            dist/lw.Web2App/docs/assets/
          Copy-Item third_party/licenses/* dist/lw.Web2App/third_party/licenses/
          $checksums = @(
            'dist/lw.Web2App/lw.Web2App.exe',
            'dist/lw.Web2App/examples/wechat-article-formatter.exe',
            'dist/lw.Web2App/examples/native-ipc.exe'
          ) | ForEach-Object {
            $hash = Get-FileHash $_ -Algorithm SHA256
            $root = (Resolve-Path 'dist/lw.Web2App').Path
            $relative = (Resolve-Path $_).Path.Substring($root.Length + 1).Replace('\', '/')
            "$($hash.Hash.ToLower())  $relative"
          }
          $checksums | Set-Content dist/lw.Web2App/SHA256SUMS.txt -Encoding ascii
          Compress-Archive -Path dist/lw.Web2App/* `
            -DestinationPath dist/lw.Web2App-windows-x64.zip -Force

      - name: Create portable Visual Studio 2022 source solution
        shell: pwsh
        run: |
          .\tools\create-vs2022-package.ps1 -Force

      - name: Upload downloadable artifact
        uses: actions/upload-artifact@v7
        with:
          name: lw.Web2App-windows-x64
          path: |
            dist/lw.Web2App-windows-x64.zip
            dist/lw.Web2App-vs2022-source.zip
            dist/lw.Web2App/SHA256SUMS.txt
            dist/SHA256SUMS-vs2022-source.txt
          if-no-files-found: error
          retention-days: 30

  linux:
    name: Ubuntu ${{ matrix.ubuntu }} - build, test and package
    runs-on: ubuntu-${{ matrix.ubuntu }}
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["22.04", "24.04"]

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Checkout integration test project
        uses: actions/checkout@v6
        with:
          repository: lxw112190/wechat-article-formatter
          ref: main
          path: integration/wechat-article-formatter

      - name: Set up Node.js for integration test
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: integration/wechat-article-formatter/package-lock.json

      - name: Install Ubuntu build and runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config dpkg-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libssl-dev xvfb xauth

      - name: Configure Release x64
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Build integration test project
        working-directory: integration/wechat-article-formatter
        run: |
          npm ci
          npm run build

      - name: Package, inspect and launch integration test application
        run: |
          set -euo pipefail
          mkdir -p dist/lw.Web2App/examples smoke-home
          ./build/lw.Web2App pack integration/wechat-article-formatter/dist \
            dist/lw.Web2App/examples/wechat-article-formatter \
            --title "公众号排版助手" --width 1440 --height 900
          test -x dist/lw.Web2App/examples/wechat-article-formatter
          ./build/lw.Web2App inspect \
            dist/lw.Web2App/examples/wechat-article-formatter \
            > dist/lw.Web2App/examples/wechat-article-formatter-manifest.json
          set +e
          HOME="$PWD/smoke-home" WEBKIT_DISABLE_COMPOSITING_MODE=1 \
            timeout 15s xvfb-run -a \
            dist/lw.Web2App/examples/wechat-article-formatter
          smoke_exit=$?
          set -e
          if [ "$smoke_exit" -ne 0 ] && [ "$smoke_exit" -ne 124 ]; then
            echo "Linux Runtime smoke test failed with exit code $smoke_exit"
            find smoke-home -type f -name '*.log' -print -exec tail -n 100 {} \;
            exit "$smoke_exit"
          fi
          runtime_log=$(find smoke-home -type f -path '*/logs/app.log' -print -quit)
          test -n "$runtime_log"
          grep -q "WebKitGTK initialized" "$runtime_log"
          grep -q "Navigation completed" "$runtime_log"
          cp integration/wechat-article-formatter/LICENSE \
            dist/lw.Web2App/examples/wechat-article-formatter-LICENSE.txt
          ./build/lw.Web2App pack examples/native-ipc \
            dist/lw.Web2App/examples/native-ipc \
            --title "Native IPC 示例" --windowed --ipc \
            --ipc-capability app.info \
            --ipc-capability dialog.directory \
            --ipc-capability dialog.file \
            --ipc-capability fs.exists \
            --ipc-capability fs.list \
            --ipc-capability fs.copy \
            --ipc-capability fs.move \
            --ipc-capability fs.delete
          ./build/lw.Web2App inspect dist/lw.Web2App/examples/native-ipc \
            > dist/lw.Web2App/examples/native-ipc-manifest.json
          grep -q '"enabled": true' \
            dist/lw.Web2App/examples/native-ipc-manifest.json
          grep -q '"app.info"' \
            dist/lw.Web2App/examples/native-ipc-manifest.json

      - name: Smoke test project publish
        run: |
          set -euo pipefail
          sed -i 's/"deb": false/"deb": true/' \
            examples/project-config/lwweb.json
          ./build/lw.Web2App publish \
            --config examples/project-config/lwweb.json \
            --output build/project-publish-smoke
          release=$(find build/project-publish-smoke -mindepth 1 -maxdepth 1 \
            -type d ! -name '.lwweb-*' -print -quit)
          test -n "$release"
          (cd "$release" && sha256sum -c SHA256SUMS.txt)
          test "$(find "$release" -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 1
          tar_contents=$(tar -tzf "$release"/*.tar.gz)
          grep -q '^Native IPC Example$' <<<"$tar_contents"
          deb=$(find "$release" -maxdepth 1 -name '*.deb' -print -quit)
          test -n "$deb"
          dpkg-deb --info "$deb"
          deb_contents=$(dpkg-deb --contents "$deb")
          grep -q './usr/bin/native-ipc$' <<<"$deb_contents"
          grep -q './usr/share/applications/native-ipc.desktop$' \
            <<<"$deb_contents"
          grep -q './usr/share/icons/hicolor/scalable/apps/native-ipc.svg$' \
            <<<"$deb_contents"
          test -n "$(dpkg-deb --field "$deb" Depends)"
          grep -q '"format": "lw-web2app-release"' "$release/RELEASE_INFO.json"
          grep -q '"platform": "linux"' "$release/RELEASE_INFO.json"
          grep -q '"type": "deb"' "$release/RELEASE_INFO.json"

      - name: Prepare Linux distributions
        run: |
          set -euo pipefail
          mkdir -p dist/lw.Web2App/docs/assets dist/lw.Web2App/examples \
            dist/lw.Web2App/third_party/licenses
          generated_deb=$(find build/project-publish-smoke -type f \
            -name '*.deb' -print -quit)
          test -n "$generated_deb"
          cp "$generated_deb" dist/lw.Web2App/examples/
          cp build/lw.Web2App dist/lw.Web2App/
          cp README.md README_EN.md LICENSE THIRD_PARTY_NOTICES.md dist/lw.Web2App/
          cp docs/assets/sponsor.jpg docs/assets/lw.Web2App.png \
            docs/assets/lw.Web2App-linux.png dist/lw.Web2App/docs/assets/
          cp third_party/licenses/* dist/lw.Web2App/third_party/licenses/
          cpack --config build/CPackConfig.cmake -G DEB -B dist/packages
          cpack --config build/CPackConfig.cmake -G TGZ -B dist/packages
          tar -C dist -czf \
            "dist/lw.Web2App-linux-x64-ubuntu-${{ matrix.ubuntu }}.tar.gz" lw.Web2App
          sha256sum \
            "dist/lw.Web2App-linux-x64-ubuntu-${{ matrix.ubuntu }}.tar.gz" \
            dist/packages/*.deb \
            dist/packages/*.tar.gz \
            dist/lw.Web2App/lw.Web2App \
            dist/lw.Web2App/examples/wechat-article-formatter \
            dist/lw.Web2App/examples/native-ipc \
            dist/lw.Web2App/examples/*.deb \
            > "dist/SHA256SUMS-linux-x64-ubuntu-${{ matrix.ubuntu }}.txt"

      - name: Upload downloadable artifact
        uses: actions/upload-artifact@v7
        with:
          name: lw.Web2App-linux-x64-ubuntu-${{ matrix.ubuntu }}
          path: |
            dist/lw.Web2App-linux-x64-ubuntu-${{ matrix.ubuntu }}.tar.gz
            dist/packages/*.deb
            dist/packages/*.tar.gz
            dist/lw.Web2App/examples/*.deb
            dist/SHA256SUMS-linux-x64-ubuntu-${{ matrix.ubuntu }}.txt
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download tested release assets
        uses: actions/download-artifact@v8
        with:
          pattern: lw.Web2App-*
          path: dist

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/**/*.zip
            dist/**/*.tar.gz
            dist/**/*.deb
            dist/**/SHA256SUMS*.txt
